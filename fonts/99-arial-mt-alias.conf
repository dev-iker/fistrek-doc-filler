<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Alias para "Arial MT" (nombre PostScript de Arial que usa el estilo por
  defecto de la plantilla contrato_trabajo del SEPE).

  Sin este alias, fontconfig no reconoce "Arial MT" y cae a DejaVu Sans,
  una fuente mucho más ancha que Arial. Eso cambia todos los saltos de
  línea del documento y provocaba: páginas de más, notas al pie
  desplazadas/duplicadas solapando el encabezado, y checkboxes VML
  descolocados ("X fantasma" en horas complementarias y contrato de
  relevo). Con el alias, "Arial MT" resuelve a Liberation Sans (clon
  métrico de Arial) y el documento pagina igual que en Word: 7 páginas.

  Verificado el 12/08/2026 contra el Word original de referencia.
-->
<fontconfig>
  <match target="pattern">
    <test name="family"><string>Arial MT</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>ArialMT</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Arial-BoldMT</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit>
  </match>
</fontconfig>
